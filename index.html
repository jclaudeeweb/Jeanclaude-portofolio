document.getElementById("application").style.display = "block";


alert("Bienvenue Vendeur");

}



else{

function bikaStock(){

let nom=document.getElementById("nomProduit").value.trim();

let quantite=Number(
document.getElementById("quantiteStock").value
);

let unite=document.getElementById("uniteStock").value;

let prix=Number(
document.getElementById("prixUnitaire").value
);


if(nom=="" || quantite<=0 || prix<=0){

alert("Shiramwo neza izina, quantité na prix");

return;

}


let total=quantite * prix;


// Kuraba nimba igicuruzwa gisanzwe kiri muri stock

let usanzwe=stocks.find(p=>p.nom==nom);


if(usanzwe){


usanzwe.quantite += quantite;

usanzwe.unite = unite;

usanzwe.total = usanzwe.quantite * usanzwe.prix;


}

else{


let produit={

nom:nom,

quantite:quantite,

unite:unite,

prix:prix,

total:total

};


stocks.push(produit);


}


localStorage.setItem(
"stocks",
JSON.stringify(stocks)
);


erekanaStock();

remplirProduitsVente();

remplirProduitsPerte();

remplirProduitsDette();

alertStock();


alert("Stock yabitswe neza");


document.getElementById("nomProduit").value="";

document.getElementById("quantiteStock").value="";

document.getElementById("prixUnitaire").value="";


}

let table=document.getElementById("tableStock");

table.innerHTML="";


stocks.forEach(function(p){


table.innerHTML += `

<td>${p.unite || "Pièce"}</td>

<td>${p.prix} Fbu / ${p.unite || "Pièce"}</td>

<td>${p.total} Fbu</td>

</tr>

`;

});


}

  function bikaVente(){

let quantite=Number(
document.getElementById("quantiteVente").value
);

document.getElementById("prixVente").value
);


let total=quantite * prix;

}

};

);

function bikaDette(){

let client=document.getElementById("nomClient").value.trim();

let ubwoko=document.getElementById("ubwokoDette").value;

let montant=Number(
document.getElementById("montantDette").value
);

let produit="";

let quantite=0;

alert("Shiramwo izina rya client");
return;
}


if(montant<=0){

alert("Shiramwo amafaranga y'ideni");

return;

}



// Nimba ari ideni ry'ikidandazwa

if(ubwoko=="produit"){


produit=document.getElementById("produitDette").value;


quantite=Number(
document.getElementById("quantiteDette").value
);



let item=stocks.find(p=>p.nom==produit);



if(!item){

alert("Hitamwo igicuruzwa");

return;

}



if(item.quantite < quantite){

alert("Stock ntihagije");

return;

}


// gukura ku stock

item.quantite -= quantite;

item.total = item.quantite * item.prix;


localStorage.setItem(
"stocks",
JSON.stringify(stocks)
);


}



// kubika dette

let dette={

client:client,

produit: ubwoko=="amafaranga" ? "Amafaranga" : produit,

quantite:quantite,

montant:montant,

uwanditse:roleActuel,

status:"Ntarariha",

date:new Date().toLocaleDateString()

};



dettes.push(dette);


localStorage.setItem(
"dettes",
JSON.stringify(dettes)
);



erekanaStock();

erekanaDette();

alertStock();



// gusukura

document.getElementById("nomClient").value="";

document.getElementById("montantDette").value="";

document.getElementById("quantiteDette").value="";



alert("Dette yabitswe neza");


}
