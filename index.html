<!DOCTYPE html>
<html lang="rn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestion  boutique,alimentation,magasin</title>
  

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align:center;
    color:green;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:green;
    color:white;
}

input, select{
    width:100%;
    padding:10px;
    margin:5px 0;
    box-sizing:border-box;
}

.menu{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.section{
    display:none;
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}
.alert{
    background:#ffdddd;
    color:red;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
}
  .rapportPDF{

background:white;
padding:20px;
margin-top:20px;
border:1px solid #ccc;
border-radius:10px;

}


@media print{


button,
.menu,
#login,
#langue{

display:none;

}


body{

background:white;

}


.rapportPDF{

border:none;

}

}
</style>

</head>


<body>
  <select id="langue" onchange="hinduraUrurimi()">

<option value="rn">Kirundi</option>
<option value="fr">Français</option>
<option value="en">English</option>
<option value="rw">Kinyarwanda</option>
<option value="sw">Kiswahili</option>

  </select>

<div class="container">

<h1 id="titre">Boutique Gestion</h1>
  <div id="alertStock"></div>


<!-- LOGIN -->
<div id="login">

<h2>Connexion</h2>

<input id="username" placeholder="Nom utilisateur">

<input id="password" type="password" placeholder="Mot de passe">

<select id="role">
<option value="boss">Boss</option>
<option value="vendeur">Vendeur</option>
</select>

<button onclick="connexion()">
Connexion
</button>

</div>



<!-- APPLICATION -->
<div id="application" style="display:none;">


<div class="menu">

<button id="btnStock" onclick="fungura('stock')">
Stock
</button>

<button id="btnVente" onclick="fungura('vente')">
Vente
</button>

<button id="btnDette" onclick="fungura('dette')">
Dette
</button>

<button id="btnDepense" onclick="fungura('depense')">
Dépense
</button>

<button id="btnRapport" onclick="fungura('rapport')">
Rapport
</button>
  <button id="btnPerte" onclick="fungura('perte')">
Pertes
  </button>
  <button onclick="logout()">
Logout
  </button>

</div>



<div id="stock" class="section">

<h2>Stock</h2>

<input id="nomProduit" placeholder="Izina ry'igicuruzwa">

<input id="quantiteStock" type="number" placeholder="Quantité">



<input id="prixUnitaire" type="number" placeholder="Prix unitaire">


<button onclick="bikaStock()">
Bika Stock
</button>


<table>

<thead>

<tr>
<th>Produit</th>
<th>Quantité</th>
<th>Prix Unitaire</th>
<th>Total</th>
</tr>

</thead>


<tbody id="tableStock">

</tbody>


</table>

</div>



<div id="vente" class="section">

<h2>Vente</h2>


<select id="produitVente">

</select>


<input id="quantiteVente" 
type="number" 
placeholder="Quantité yagurishijwe">


<input id="prixVente" 
type="number" 
placeholder="Prix unitaire yo kugurisha">


<button onclick="bikaVente()">
Bika Vente
</button>



<table>

<thead>

<tr>

<th>Produit</th>
<th>Quantité</th>
<th>Prix</th>
<th>Total</th>

</tr>

</thead>


<tbody id="tableVente">

</tbody>


</table>


</div>


<div id="dette" class="section">

<h2>Dette</h2>


<input id="nomClient" 
placeholder="Izina rya client">


<input id="produitDette" 
placeholder="Igicuruzwa yafashe">


<input id="montantDette" 
type="number"
placeholder="Amafaranga y'ideni">


<button onclick="bikaDette()">
Bika Dette
</button>



<table>

<thead>

<tr>

<th>Client</th>
<th>Produit</th>
<th>Montant</th>
<th>Yanditswe na</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>


<tbody id="tableDette">

</tbody>


</table>


</div>



<div id="depense" class="section">

<h2>Dépense</h2>


<input id="montantDepense" 
type="number" 
placeholder="Amafaranga yakoreshejwe">


<input id="raisonDepense" 
placeholder="Insiguro ya dépense">


<button onclick="bikaDepense()">
Bika Dépense
</button>



<table>

<thead>

<tr>

<th>Montant</th>
<th>Insiguro</th>
<th>Date</th>

</tr>

</thead>


<tbody id="tableDepense">

</tbody>


</table>


</div>



<div id="rapport" class="section">

<h2>Rapport</h2>


<button onclick="koraRapport()">
Kora Rapport
</button>


<div id="resultatRapport" class="rapportPDF">

</div>


<button onclick="imprimerRapport()">
Imprimer PDF
</button>


<button onclick="oherezaWhatsApp()">
WhatsApp
</button>
  <button onclick="gusibaVyose()" style="background:red; margin-left:20px;">
Futa Vyose
  </button>


</div>
  <div id="perte" class="section">

<h2>Pertes</h2>


<select id="produitPerte">

</select>


<input id="quantitePerte"
type="number"
placeholder="Quantité cahomvye">


<input id="raisonPerte"
placeholder="Impamvu y'igihombo">


<button onclick="bikaPerte()">
Bika Perte
</button>



<table>

<thead>

<tr>
<th>Produit</th>
<th>Quantité</th>
<th>Impamvu</th>
<th>Date</th>
</tr>

</thead>


<tbody id="tablePerte">

</tbody>


</table>


  </div>



</div>

</div>



<script>
  let pertes = JSON.parse(localStorage.getItem("pertes")) || [];
  let dettes = JSON.parse(localStorage.getItem("dettes")) || [];

  let depenses = JSON.parse(localStorage.getItem("depenses")) || [];
  let ventes = JSON.parse(localStorage.getItem("ventes")) || [];
  let stocks = JSON.parse(localStorage.getItem("stocks")) || [];
  let utilisateurActuel = "";
let roleActuel = "";


function connexion(){

let user = document.getElementById("username").value.trim();

let pass = document.getElementById("password").value.trim();

let role = document.getElementById("role").value;



if(user === "boss" && pass === "1234" && role === "boss"){


utilisateurActuel = "boss";

roleActuel = "boss";


document.getElementById("login").style.display = "none";

document.getElementById("application").style.display = "block";


alert("Bienvenue Boss");


permissions();


}



else if(user === "vendeur" && pass === "1111" && role === "vendeur"){


utilisateurActuel = "vendeur";

roleActuel = "vendeur";


document.getElementById("login").style.display = "none";

document.getElementById("application").style.display = "block";


alert("Bienvenue Vendeur");


permissions();


}



else{


alert("Nom utilisateur, mot de passe ou rôle incorrect");


}


}



function fungura(id){

let sections=document.querySelectorAll(".section");

sections.forEach(function(sec){

sec.style.display="none";

});


document.getElementById(id).style.display="block";

}
let indimi={

fr:{
titre:"Gestion Boutique",
stock:"Stock",
vente:"Vente",
dette:"Dette",
depense:"Dépense",
rapport:"Rapport"
},

en:{
titre:"Shop Management",
stock:"Stock",
vente:"Sale",
dette:"Debt",
depense:"Expense",
rapport:"Report"
},

rn:{
titre:"Gucungera Boutique",
stock:"Stock",
vente:"Kudandaza",
dette:"Amadeni",
depense:"Amafaranga yakoreshejwe",
rapport:"Raporo"
},

rw:{
titre:"Gucunga Ububiko",
stock:"Ububiko",
vente:"Kugurisha",
dette:"Amadeni",
depense:"Amafaranga yakoreshejwe",
rapport:"Raporo"
},

sw:{
titre:"Usimamizi wa Duka",
stock:"Hifadhi",
vente:"Mauzo",
dette:"Madeni",
depense:"Matumizi",
rapport:"Ripoti"
}

};



function hinduraUrurimi(){

let langue=document.getElementById("langue").value;

let t=indimi[langue];


document.getElementById("titre").innerHTML=t.titre;

document.getElementById("btnStock").innerHTML=t.stock;

document.getElementById("btnVente").innerHTML=t.vente;

document.getElementById("btnDette").innerHTML=t.dette;

document.getElementById("btnDepense").innerHTML=t.depense;

document.getElementById("btnRapport").innerHTML=t.rapport;


  }
  function permissions(){

let btnRapport=document.getElementById("btnRapport");


// Boss abona vyose
if(roleActuel=="boss"){

btnRapport.style.display="inline-block";

}


// Vendeur abona vyose ariko nta rapport
if(roleActuel=="vendeur"){

btnRapport.style.display="none";

}

  }




  function bikaStock(){

let nom=document.getElementById("nomProduit").value.trim();

let quantite=Number(
document.getElementById("quantiteStock").value
);

let prix=Number(
document.getElementById("prixUnitaire").value
);


// Kugenzura ko vyose vyuzuye
if(nom=="" || quantite<=0 || prix<=0){

alert("Shiramwo neza izina, quantité na prix");

return;

}


let total=quantite * prix;


// Kuraba ko igicuruzwa gisanzwe kiri muri stock

let usanzwe=stocks.find(p=>p.nom==nom);


if(usanzwe){


// kwongerako quantité
usanzwe.quantite += quantite;


// kubara agaciro ka stock
usanzwe.total = usanzwe.quantite * usanzwe.prix;


}

else{


let produit={

nom:nom,

quantite:quantite,

prix:prix,

total:total

};


stocks.push(produit);


}



// kubika muri telephone

localStorage.setItem(
"stocks",
JSON.stringify(stocks)
);



// kwerekana muri tableau

erekanaStock();


// guhindura liste ya vente

remplirProduitsVente();

remplirProduitsPerte();


// kwerekana alert stock

alertStock();



alert("Stock yabitswe neza");



// gusukura formulaire

document.getElementById("nomProduit").value="";

document.getElementById("quantiteStock").value="";

document.getElementById("prixUnitaire").value="";


  }
  function erekanaStock(){

let table=document.getElementById("tableStock");

table.innerHTML="";


stocks.forEach(function(p){


table.innerHTML += `

<tr>

<td>${p.nom}</td>

<td>${p.quantite}</td>

<td>${p.prix} Fbu</td>

<td>${p.total} Fbu</td>

</tr>

`;


});


  }
  

  window.onload=function(){

erekanaStock();

erekanaVente();

remplirProduitsVente();

erekanaDepense();

erekanaDette();

remplirProduitsPerte();

erekanaPerte();

alertStock();

  }
  function remplirProduitsVente(){

let select=document.getElementById("produitVente");

select.innerHTML="";


stocks.forEach(function(p){

select.innerHTML += `

<option value="${p.nom}">
${p.nom} (Stock:${p.quantite})
</option>

`;

});

  }
  function bikaVente(){

let nom=document.getElementById("produitVente").value;

let quantite=Number(
document.getElementById("quantiteVente").value
);


let prix=Number(
document.getElementById("prixVente").value
);


let total=quantite * prix;



let produit=stocks.find(p=>p.nom==nom);



if(!produit){

alert("Produit ntiboneka");

return;

}



if(produit.quantite < quantite){

alert("Stock ntihagije");

return;

}



// kugabanya stock

produit.quantite -= quantite;

produit.total = produit.quantite * produit.prix;



let vente={

nom:nom,

quantite:quantite,

prix:prix,

total:total,

date:new Date().toLocaleDateString()

};



ventes.push(vente);



localStorage.setItem(
"ventes",
JSON.stringify(ventes)
);


localStorage.setItem(
"stocks",
JSON.stringify(stocks)
);



erekanaStock();

alertStock();

erekanaVente();


alert("Vente yabitswe");


  }
  function erekanaVente(){

let table=document.getElementById("tableVente");

table.innerHTML="";


ventes.forEach(function(v){


table.innerHTML += `

<tr>

<td>${v.nom}</td>

<td>${v.quantite}</td>

<td>${v.prix} Fbu</td>

<td>${v.total} Fbu</td>

</tr>

`;

});


  }
  function bikaDepense(){
    if(roleActuel!="boss"){

alert("Boss gusa niwe ashobora kwandika dépense");

return;

    }


let montant=Number(
document.getElementById("montantDepense").value
);


let raison=
document.getElementById("raisonDepense").value;



let depense={

montant:montant,

raison:raison,

date:new Date().toLocaleDateString()

};



depenses.push(depense);



localStorage.setItem(
"depenses",
JSON.stringify(depenses)
);



erekanaDepense();



alert("Dépense yabitswe");
    // Gusukura zone de texte
document.getElementById("montantDepense").value="";
document.getElementById("raisonDepense").value="";


  }
  function erekanaDepense(){


let table=document.getElementById("tableDepense");

table.innerHTML="";



depenses.forEach(function(d){


table.innerHTML += `

<tr>

<td>${d.montant} Fbu</td>

<td>${d.raison}</td>

<td>${d.date}</td>

</tr>

`;


});


}
  function bikaDette(){


let client=document.getElementById("nomClient").value;


let produit=document.getElementById("produitDette").value;


let montant=Number(
document.getElementById("montantDette").value
);



let dette={

client:client,

produit:produit,

montant:montant,

uwanditse:roleActuel,

status:"Ntarariha"

};



dettes.push(dette);



localStorage.setItem(
"dettes",
JSON.stringify(dettes)
);



erekanaDette();


alert("Dette yabitswe");
// Gusukura formulaire ya dette
document.getElementById("nomClient").value="";
document.getElementById("produitDette").value="";
document.getElementById("montantDette").value="";

  }
  function erekanaDette(){


let table=document.getElementById("tableDette");

table.innerHTML="";



dettes.forEach(function(d,index){


table.innerHTML += `

<tr>

<td>${d.client}</td>

<td>${d.produit}</td>

<td>${d.montant} Fbu</td>

<td>${d.uwanditse || "Nta zina"}</td>

<td>
${d.status}
</td>


<td>

<button onclick="yishuye(${index})">

Yarishe

</button>

</td>


</tr>

`;

});


  }
function yishuye(index){


dettes[index].status="Yarishe";


localStorage.setItem(
"dettes",
JSON.stringify(dettes)
);



erekanaDette();


  }
  function remplirProduitsPerte(){

let select=document.getElementById("produitPerte");

select.innerHTML="";


stocks.forEach(function(p){

select.innerHTML +=`

<option value="${p.nom}">
${p.nom} (Stock:${p.quantite})
</option>

`;

});

  }
  function bikaPerte(){


let nom=document.getElementById("produitPerte").value;


let quantite=Number(
document.getElementById("quantitePerte").value
);


let raison=
document.getElementById("raisonPerte").value;



let produit=stocks.find(p=>p.nom==nom);



if(!produit){

alert("Produit ntiboneka");

return;

}



if(produit.quantite < quantite){

alert("Stock ntihagije");

return;

}



// kugabanya stock

produit.quantite -= quantite;

produit.total = produit.quantite * produit.prix;



let perte={

nom:nom,

quantite:quantite,

raison:raison,

date:new Date().toLocaleDateString()

};



pertes.push(perte);



localStorage.setItem(
"stocks",
JSON.stringify(stocks)
);


localStorage.setItem(
"pertes",
JSON.stringify(pertes)
);



erekanaStock();

alertStock();

erekanaPerte();


alert("Perte yabitswe");
// Gusukura formulaire ya perte
document.getElementById("quantitePerte").value="";
document.getElementById("raisonPerte").value="";

  }
  function erekanaPerte(){


let table=document.getElementById("tablePerte");

table.innerHTML="";


pertes.forEach(function(p){


table.innerHTML +=`

<tr>

<td>${p.nom}</td>

<td>${p.quantite}</td>

<td>${p.raison}</td>

<td>${p.date}</td>

</tr>

`;

});


  }
  function alertStock(){

let zone=document.getElementById("alertStock");

zone.innerHTML="";


stocks.forEach(function(p){


if(p.quantite <= 5){


zone.innerHTML += `

<div class="alert">

⚠️ Stock iri hasi:
${p.nom} hasigaye ${p.quantite}

</div>

`;


}


});


  }
  function koraRapport(){

if(roleActuel!="boss"){

alert("Ntufise uburenganzira bwo kubona rapport");

return;

}


let totalVente=0;

ventes.forEach(function(v){

totalVente += v.total;

});


let totalDepense=0;

depenses.forEach(function(d){

totalDepense += d.montant;

});


let totalDette=0;

dettes.forEach(function(d){

if(d.status=="Ntarariha"){

totalDette += d.montant;

}

});


// Kwerekana ibihombo vyose
let totalPerte="";

pertes.forEach(function(p){

totalPerte += `

<p>
❌ <b>Produit cahomvye:</b> ${p.nom}<br>
📦 <b>Quantité:</b> ${p.quantite}<br>
📝 <b>Impamvu:</b> ${p.raison}<br>
📅 <b>Date:</b> ${p.date}
</p>

<hr>

`;

});


let stockTotal=0;

stocks.forEach(function(p){

stockTotal += p.quantite;

});


let solde=totalVente-totalDepense;


let date=new Date().toLocaleString();


document.getElementById("resultatRapport").innerHTML=`

<h2>🏪 Boutique Gestion</h2>

<p><b>Date:</b> ${date}</p>

<hr>


<p>💰 Amafaranga yinjiye:
<b>${totalVente} Fbu</b>
</p>


<p>💸 Dépenses:
<b>${totalDepense} Fbu</b>
</p>


<p>📒 Amadeni atarariha:
<b>${totalDette} Fbu</b>
</p>


<h3>❌ Ibihombo</h3>

${totalPerte || "Nta gihombo canditswe"}


<p>📦 Stock isigaye:
<b>${stockTotal}</b>
</p>


<hr>


<h3>
💵 Solde:
${solde} Fbu
</h3>


`;

                  }

  function imprimerRapport(){

window.print();

  }
  function oherezaWhatsApp(){


let rapport=
document.getElementById("resultatRapport").innerText;


let message=
"🏪 Boutique Gestion\n\n"+
rapport;



let url=
"https://wa.me/?text="+
encodeURIComponent(message);



window.open(url,"_blank");


  }
  function logout(){

utilisateurActuel="";
roleActuel="";

document.getElementById("application").style.display="none";

document.getElementById("login").style.display="block";


document.getElementById("username").value="";
document.getElementById("password").value="";


  }
  function gusibaVyose(){

let ukwemeza = confirm("Urashaka vy'ukuri gufuta amakuru yose?");

if(ukwemeza){

localStorage.removeItem("stocks");
localStorage.removeItem("ventes");
localStorage.removeItem("dettes");
localStorage.removeItem("depenses");
localStorage.removeItem("pertes");


stocks=[];
ventes=[];
dettes=[];
depenses=[];
pertes=[];


erekanaStock();
erekanaVente();
erekanaDette();
erekanaDepense();
erekanaPerte();

alert("Amakuru yose yafutwe neza");

}

  }
</script>


</body>
</html>
